<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UZU ROASTER - Analytics</title>
<style>
:root{--bg:#0b0d0c;--card:#151816;--card2:#1d221f;--card3:#252b27;--accent:#a8d86e;--accent2:#ff8c42;--accent3:#8d6e63;--cyan:#4ecdc4;--text:#e8e6e1;--muted:#8a8885;--line:#2a2e2b}
:root.light{--bg:#faf8f5;--card:#ffffff;--card2:#f5f2ee;--card3:#ebe7e1;--accent:#5a8a2a;--accent2:#c45a1a;--accent3:#7a5a4a;--cyan:#2a8a82;--text:#1a1a18;--muted:#8a8580;--line:#e0ddd8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);padding:16px;transition:background 0.2s,color 0.2s}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{font-size:18px;letter-spacing:0.18em} h1 span{color:var(--accent)}
.mono{font-size:12px;color:var(--muted);line-height:1.6}
.toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px;gap:2px}
.toggle button{border:none;background:transparent;color:var(--muted);padding:7px 16px;border-radius:16px;font-family:inherit;font-size:13px;cursor:pointer;transition:0.15s}
.toggle button.active{background:var(--card3);color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.simple{border-color:var(--accent)}
h2{font-size:12px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:1100px){.grid6{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid6,.grid4,.grid3,.grid2{grid-template-columns:1fr}}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:0.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:15px;font-weight:800;margin-top:3px}
.stat .v small{font-size:11px;color:var(--muted);font-weight:400}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.line b{color:var(--accent)}
canvas.chart-main{width:100%;aspect-ratio:16/9;height:auto;max-height:520px;background:var(--card2);border-radius:12px;border:1px solid var(--line);display:block}
canvas.radar{width:100%;aspect-ratio:1/1;height:auto;max-width:380px;background:var(--card2);border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto}
.modern-stats{display:flex;flex-direction:column;gap:10px}
.ms-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ms-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card3);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px}
.ms-pill b{font-size:13px;color:var(--text)}
.ms-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ms-label{font-size:10px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase}
.phase-modern{display:flex;height:36px;border-radius:10px;overflow:hidden;margin:0;border:1px solid var(--line);background:var(--card2)}
.phase-seg{display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:13px;letter-spacing:0.04em}
.phase-seg.dry{background:#a8d86e}
.phase-seg.maill{background:#ffad4a}
.phase-seg.dev{background:#c45a3c;color:#fff}
.phase-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.phase-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.phase-legend-item b{color:var(--text)}
.phase-legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.phase{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0}
.badge{font-size:11px;padding:2px 6px;border-radius:12px;background:var(--card3);border:1px solid var(--line)}
.manual{display:none}
body.mode-manual .manual{display:block}
body.mode-manual .basic-view{display:none}
.advanced{display:none;margin-top:12px}
.advanced.open{display:block}
@media print{
  body{background:#fff!important;color:#000!important}
  .header,.toggle,#drop,button{display:none!important}
  .card{border:1px solid #ccc!important;break-inside:avoid}
  canvas{background:#fff!important;border:1px solid #ccc!important}
  .advanced{display:block!important}
}
</style>
</head>

<script>


function getDataFromURL(){
  try{
    // 1. ハッシュフラグメントから (#data=...) を最優先で読む - Cloudflare回避のためサーバーに送られない
    var hash = location.hash || '';
    if(hash.indexOf('data=') >= 0){
      var m = hash.match(/data=([^&]+)/);
      if(m && m[1]){
        var d = m[1];
        try{
          var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          while(b64.length % 4) b64 += '=';
          var jsonStr = decodeURIComponent(escape(atob(b64)));
          return JSON.parse(jsonStr);
        }catch(e){}
      }
    }
    // 2. クエリパラメータから (?data=...) - 後方互換
    var p = new URLSearchParams(location.search);
    var d = p.get('data') || p.get('p') || p.get('json');
    if(!d) return null;
    // Try base64url first if it looks like base64
    var trimmed = d.trim();
    // If it starts with { or [, it's plain JSON (already decoded by URLSearchParams)
    if(trimmed.charAt(0) === '{' || trimmed.charAt(0) === '['){
      return JSON.parse(trimmed);
    }
    // Try to decode as URI component (in case it was %7B... encoded and not yet decoded)
    try{
      var maybeJson = decodeURIComponent(d);
      if(maybeJson.trim().charAt(0) === '{' || maybeJson.trim().charAt(0) === '['){
        return JSON.parse(maybeJson);
      }
    }catch(e){}
    // Otherwise assume Base64URL
    try{
      var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
      while(b64.length % 4) b64 += '=';
      var jsonStr = decodeURIComponent(escape(atob(b64)));
      return JSON.parse(jsonStr);
    }catch(e){
      return null;
    }
  }catch(e){
    console.error(e);
    return null;
  }
}

const SAMPLE={"type":"roast_profile","title":"Ethiopia Natural - Demo","memo":"150g / 1st 8:30 @195C / DTR 22%","profile":[{"time":0,"temp":95,"event":"CHARGE 95C"},{"time":15,"temp":78.2},{"time":30,"temp":76.5,"event":"TP"},{"time":90,"temp":112},{"time":150,"temp":148,"event":"DE"},{"time":270,"temp":191,"event":"FCS"},{"time":300,"temp":195,"event":"FCE"},{"time":360,"temp":204,"event":"DROP"}]};
function parse(data){
  let raw=(data.profile||[]).slice().sort((a,b)=>a.time-b.time); if(!raw.length) throw 'empty';
  function calcStats(asSec){
    let vals=[];
    for(let i=1;i<raw.length;i++){
      let dt=raw[i].time-raw[i-1].time; if(dt===0) continue;
      let dT=raw[i].temp-raw[i-1].temp;
      let ror=asSec? dT/dt*60 : dT/dt;
      if(isFinite(ror)) vals.push(ror);
    }
    if(!vals.length) return {inRange:0, median:999};
    let median=[...vals].sort((a,b)=>a-b)[Math.floor(vals.length/2)];
    let inRange=vals.filter(v=>v>=1 && v<=40).length / vals.length;
    return {inRange, median};
  }
  let secStats=calcStats(true);
  let minStats=calcStats(false);
  let isMinUnit;
  if(secStats.inRange===0 && minStats.inRange===0){ isMinUnit = raw[raw.length-1].time <= 30; }
  else {
    if(Math.abs(secStats.median) > 80 && Math.abs(minStats.median) <= 40) isMinUnit = true;
    else if(Math.abs(minStats.median) > 80 && Math.abs(secStats.median) <= 40) isMinUnit = false;
    else isMinUnit = minStats.inRange >= secStats.inRange;
  }
  if(raw[raw.length-1].time < 60 && secStats.inRange > 0.3) isMinUnit = false;
  let p = raw.map(x=> ({...x, time: isMinUnit ? x.time*60 : x.time}));
  let originalUnit = isMinUnit ? 'min' : 'sec';
  const find=(names)=>{ const up=names.map(s=>s.toUpperCase()); return p.find(x=>x.event&&up.some(k=>x.event.toUpperCase().includes(k))); };
  const charge=find(['CHARGE'])||p[0];
  const tp=(()=>{ let ci=p.indexOf(charge),min=Infinity,idx=ci; for(let i=ci;i<Math.min(p.length,ci+30);i++){ if(p[i].temp<min){min=p[i].temp; idx=i;}} return p[idx];})();
  const de=find(['DRY','DE','YELLOW'])||null; const fcs=find(['FCS','FC START','1ST','1C START'])||null; const fce=find(['FCE','FC END'])||null; const scs=find(['SCS','SC START','2ND'])||null; const drop=p[p.length-1];
  let rors=[]; for(let i=1;i<p.length;i++){ let dt=p[i].time-p[i-1].time; if(dt===0)continue; let dT=p[i].temp-p[i-1].temp; let ror=dT/dt*60; rors.push({time:p[i].time,value:ror}); }
  let vals=rors.map(r=>r.value).filter(isFinite); let maxRoR=vals.length?Math.max(...vals):0,minRoR=vals.length?Math.min(...vals):0; let avgRoR=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; let medianRoR=vals.length?[...vals].sort((a,b)=>a-b)[Math.floor(vals.length/2)]:0; let stdRoR=vals.length?Math.sqrt(vals.reduce((a,b)=>a+(b-avgRoR)**2,0)/vals.length):0;
  const t=(ev)=>ev?ev.time:null; const dur=(a,b)=> (a!=null&&b!=null)?b-a:null;
  let cT=t(charge), deT=t(de), fcsT=t(fcs), dropT=t(drop); let dryDur=dur(cT,deT), maillDur=dur(deT,fcsT), devDur=dur(fcsT,dropT), total=dur(cT,dropT); let DTR=devDur&&total?devDur/total*100:null;
  let temps=p.map(x=>x.temp); let maxBT=Math.max(...temps), minBT=Math.min(...temps);
  let auc=0, aucAbove100=0; for(let i=1;i<p.length;i++){ let dt=(p[i].time-p[i-1].time)/60; let avgT=(p[i].temp+p[i-1].temp)/2; auc+=avgT*dt; if(avgT>100)aucAbove100+=(avgT-100)*dt; }
  const rorAt=(ev)=>{ if(!ev)return null; let best=rors.reduce((b,c)=>Math.abs(c.time-ev.time)<Math.abs(b.time-ev.time)?c:b, rors[0]); return best?.value??null; };
  let crash=null,flick=null; if(fcs){ let dev=rors.filter(r=>r.time>=fcs.time); for(let i=1;i<dev.length;i++){ let d=dev[i-1].value-dev[i].value; if(d>5){crash=d;break;}} let last=rors.filter(r=>r.time>dropT-60); if(last.length>=2){ let d=last[last.length-1].value-last[0].value; if(d>1.5)flick=d; } }
  const slope=(a,b)=>{ if(!a||!b)return null; let dt=(b.time-a.time)/60; if(dt===0)return null; return (b.temp-a.temp)/dt; };
  let accels=[]; for(let i=1;i<rors.length;i++){ let dt=(rors[i].time-rors[i-1].time)/60; let dv=rors[i].value-rors[i-1].value; accels.push(dv/(dt||1)); } let maxAccel=accels.length?Math.max(...accels):0, minAccel=accels.length?Math.min(...accels):0;
  return {p, originalUnit, charge,tp,de,fcs,fce,scs,drop,rors,vals,maxRoR,minRoR,avgRoR,medianRoR,stdRoR,dryDur,maillDur,devDur,total,DTR,maxBT,minBT,auc,aucAbove100,rorAt,crash,flick,slope,accels,maxAccel,minAccel,title:data.title||'Untitled',memo:data.memo||''}
}
function fmt(sec){ if(sec==null||!isFinite(sec))return '--:--'; let m=Math.floor(sec/60), s=Math.floor(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function fmtDur(sec){ return sec==null?'--:--':fmt(sec); }
function pct(a,b){ if(a==null||!b)return '--.-%'; return (a/b*100).toFixed(1)+'%'; }
function S(k,v,sub=''){ return `<div class="stat"><div class="k">${k}</div><div class="v">${v} ${sub?`<small>${sub}</small>`:''}</div></div>`; }
function setupCanvas(canvas){
  if(!canvas) return null;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  if(rect.width===0 || rect.height===0) return null;
  const w=Math.round(rect.width*dpr);
  const h=Math.round(rect.height*dpr);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  const ctx=canvas.getContext('2d');
  if(!ctx) return null;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, W:rect.width, H:rect.height};
}
function drawFlavorRadar(canvas, s){
  const sc=setupCanvas(canvas);
  if(!sc) return;
  const {ctx, W, H}=sc;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2+8, R=Math.min(W,H)*0.36;
  const axes=[
    {label:'ACID', val:s.radar.acid},
    {label:'SWEET', val:s.radar.sweet},
    {label:'BODY', val:s.radar.body},
    {label:'ROAST', val:s.radar.roast},
    {label:'BITTER', val:s.radar.bitter},
    {label:'BALANCE', val:s.radar.balance}
  ];
  const n=axes.length;
  const isLight=document.documentElement.classList.contains('light');
  const textColor=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e8e6e1';
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#a8d86e';
  for(let lvl=1; lvl<=4; lvl++){
    ctx.beginPath();
    ctx.strokeStyle= isLight ? (lvl===4 ? 'rgba(0,0,0,0.40)' : 'rgba(0,0,0,0.22)') : (lvl===4 ? 'rgba(232,230,225,0.42)' : 'rgba(232,230,225,0.24)');
    ctx.lineWidth= lvl===4 ? 1.6 : 1;
    for(let i=0;i<n;i++){
      let ang = (Math.PI*2*i/n) - Math.PI/2;
      let r = R*lvl/4;
      let x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.strokeStyle= isLight ? 'rgba(0,0,0,0.32)' : 'rgba(232,230,225,0.34)';
  ctx.lineWidth=1.2;
  for(let i=0;i<n;i++){
    let ang=(Math.PI*2*i/n)-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*R, cy+Math.sin(ang)*R); ctx.stroke();
  }
  ctx.fillStyle=textColor; ctx.font='bold 11px JetBrains Mono, monospace';
  for(let i=0;i<n;i++){
    let ang=(Math.PI*2*i/n)-Math.PI/2;
    let x=cx+Math.cos(ang)*(R+22), y=cy+Math.sin(ang)*(R+22);
    ctx.textAlign = Math.cos(ang)>0.3 ? 'left' : Math.cos(ang)<-0.3 ? 'right' : 'center';
    ctx.textBaseline='middle'; ctx.fillText(axes[i].label, x, y);
  }
  ctx.beginPath(); let pts=[];
  for(let i=0;i<n;i++){
    let ang=(Math.PI*2*i/n)-Math.PI/2;
    let v=Math.max(0,Math.min(10, axes[i].val))/10;
    let r=R*v; let x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
    pts.push({x,y}); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fillStyle='rgba(168,216,110,0.22)'; ctx.fill();
  ctx.strokeStyle=accent; ctx.lineWidth=1.8; ctx.stroke();
  pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,4.5,0,Math.PI*2); ctx.fillStyle=accent; ctx.fill(); });
}
function drawChart(canvas,s){
  const sc=setupCanvas(canvas);
  if(!sc) return;
  const {ctx, W, H}=sc;
  ctx.clearRect(0,0,W,H);
  const ml=48,mr=40,mt=16,mb=32,pw=W-ml-mr,ph=H-mt-mb;
  let tMin=Math.min(...s.p.map(x=>x.time)), tMax=Math.max(...s.p.map(x=>x.time));
  let tempMin=Math.min(...s.p.map(x=>x.temp))-3, tempMax=Math.max(...s.p.map(x=>x.temp))+3;
  let rMin=Math.min(-5,...s.vals), rMax=Math.max(...s.vals)+2;
  const x=(t)=>ml+(t-tMin)/(tMax-tMin||1)*pw; const yT=(v)=>mt+(1-(v-tempMin)/(tempMax-tempMin||1))*ph; const yR=(v)=>mt+(1-(v-rMin)/(rMax-rMin||1))*ph;
  const textColor=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e8e6e1';
  const muted=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'#8a8885';
  const isLight=document.documentElement.classList.contains('light');
  ctx.strokeStyle= isLight ? 'rgba(0,0,0,0.26)' : 'rgba(232,230,225,0.28)';
  ctx.lineWidth=1.1;
  for(let i=0;i<=5;i++){ let y=mt+i*ph/5; ctx.beginPath(); ctx.moveTo(ml,y); ctx.lineTo(W-mr,y); ctx.stroke(); }
  ctx.strokeStyle= isLight ? 'rgba(0,0,0,0.12)' : 'rgba(232,230,225,0.12)';
  ctx.lineWidth=0.8;
  for(let i=0;i<=6;i++){ let xg=ml+i*pw/6; ctx.beginPath(); ctx.moveTo(xg,mt); ctx.lineTo(xg,mt+ph); ctx.stroke(); }
